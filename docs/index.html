const MENU = window.__DATA__.menu;
const MEAL_COMPOSITION = window.__DATA__.composition;

function esc(s){ return String(s).replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])); }

// 名称归一化（去规格词、全半角括号、空白）
function normalizeName(s) {
  return String(s).replace(/中杯|大杯|小杯|加冰|少冰|去冰|冰|热/g, '')
    .replace(/[（(]/g, '').replace(/[）)]/g, '').replace(/\s+/g, '').trim();
}

// 品类近似匹配（营养表查不到时，用同类已知单品均值估算）
const CATEGORY_KEYS = [
  { re: /鸡腿堡|麦辣|龙焰|板烧|鸡腿/, keys: ['麦辣鸡腿汉堡', '板烧鸡腿堡'] },
  { re: /鸡翅|V翅|脆汁鸡/, keys: ['麦辣鸡翅-2块', '麦麦脆汁鸡-琵琶腿'] },
  { re: /牛堡|巨无霸|吉士|安格斯|汉堡包/, keys: ['巨无霸', '双层吉士汉堡', '吉士汉堡包', '不素之霸双层牛堡'] },
  { re: /鱼堡|鳕鱼|麦香鱼|鱼排/, keys: ['麦香鱼', '双层深海鳕鱼堡', '儿童鱼排堡'] },
  { re: /鸡块|麦乐鸡|鸡球/, keys: ['麦乐鸡5块', '麦乐鸡4块', '麦麦趣鸡球'] },
  { re: /薯条|薯饼|扭扭薯/, keys: ['中薯条', '大薯条', '小薯条'] },
  { re: /可乐/, keys: ['可乐中杯', '可乐大杯'] },
  { re: /雪碧/, keys: ['雪碧中杯', '雪碧大杯'] },
  { re: /咖啡|奶铁|美式|玛奇朵|卡布奇诺/, keys: ['浓缩咖啡', '鲜萃咖啡'] },
  { re: /鸡排|那么大/, keys: ['那么大鸡排'] },
  { re: /玉米/, keys: ['大杯玉米杯', '小杯玉米杯'] },
  { re: /苹果/, keys: ['苹果片', '100%苹果汁'] },
  { re: /新地|麦旋风|圆筒|冰淇淋|雪冰/, keys: ['奥利奥麦旋风', '草莓麦旋风', '圆筒冰淇淋'] },
  { re: /派/, keys: ['香芋派', '菠萝派'] },
  { re: /卷/, keys: ['火腿扒早安营养卷', '鲜蔬蛋沙拉叠叠卷', '鸡肉蛋沙拉叠叠卷'] },
  { re: /牛奶|鲜奶/, keys: ['纯牛奶（盒装）', '纯牛奶(盒装)'] },
];
function estimateByCategory(name) {
  for (const c of CATEGORY_KEYS) {
    if (c.re.test(name)) {
      let kcal=0, protein=0, fat=0, carb=0, n=0;
      for (const k of c.keys) {
        const v = NUTRITION[k];
        if (v) { kcal+=v.kcal; protein+=v.protein; fat+=v.fat; carb+=v.carb; n++; }
      }
      if (n) return { kcal: Math.round(kcal/n), protein: Math.round(protein/n), fat: Math.round(fat/n), carb: Math.round(carb/n), estimated: true };
    }
  }
  return null;
}
function findFuzzy(name) {
  if (NUTRITION[name]) return NUTRITION[name];
  const base = normalizeName(name);
  if (!base) return null;
  for (const k in NUTRITION) { if (normalizeName(k) === base) return NUTRITION[k]; }
  for (const k in NUTRITION) { const nk = normalizeName(k); if (nk && (nk.includes(base) || base.includes(nk))) return NUTRITION[k]; }
  return null;
}
// 套餐营养求和
function sumNutrition(items) {
  let kcal=0, protein=0, fat=0, carb=0, estimated=false;
  for (const it of items) {
    let r = NUTRITION[it.name] || findFuzzy(it.name);
    if (!r) r = estimateByCategory(it.name);
    if (!r) return null;
    if (r.estimated) estimated = true;
    const q = it.quantity || 1;
    kcal += r.kcal*q; protein += r.protein*q; fat += r.fat*q; carb += r.carb*q;
  }
  return { kcal: Math.round(kcal), protein: Math.round(protein), fat: Math.round(fat), carb: Math.round(carb), estimated };
}
// 解析某个餐品的营养（套餐优先拆包，其次模糊，最后品类估算）
function resolveNutrition(name) {
  const isCombo = /套餐|三件套|套/.test(name);
  if (isCombo) {
    const comp = MEAL_COMPOSITION[name];
    if (comp && comp.length) {
      const sum = sumNutrition(comp);
      if (sum) return { nutr: sum, composition: comp };
    }
    const r = NUTRITION[name] || findFuzzy(name) || estimateByCategory(name);
    return { nutr: r, composition: comp || null };
  }
  const r = NUTRITION[name] || findFuzzy(name) || estimateByCategory(name);
  return { nutr: r, composition: null };
}

// 解析自然语言意图
function parseIntent(text) {
  const cond = { priceMin: null, priceMax: null, kcalMax: null, taste: null, goal: null, mealType: null, isKids: false };
  const t = text;
  // 价格
  let m = t.match(/(\d+(?:\.\d+)?)\s*[-~到至]\s*(\d+(?:\.\d+)?)\s*元/);
  if (m) { cond.priceMin = parseFloat(m[1]); cond.priceMax = parseFloat(m[2]); }
  else {
    m = t.match(/(\d+(?:\.\d+)?)\s*元?(?:以内|以下)/);
    if (m) { cond.priceMax = parseFloat(m[1]); }
    else {
      // "X 元左右/上下/大概" → 容差 ±10%
      m = t.match(/(\d+(?:\.\d+)?)\s*元?(?:左右|上下|大概|约)/);
      if (m) { const v = parseFloat(m[1]); cond.priceMin = Math.round(v * 0.9 * 10) / 10; cond.priceMax = Math.round(v * 1.1 * 10) / 10; }
    }
  }
  // 热量
  m = t.match(/(\d+)\s*(?:大卡|千卡|kcal|卡路里)?(?:以内|以下|左右)/);
  if (m && (t.includes('大卡') || t.includes('千卡') || t.includes('kcal') || t.includes('卡路里') || t.includes('热量'))) {
    cond.kcalMax = parseInt(m[1]);
  }
  // 营养目标
  if (/高蛋白|增肌|蛋白/.test(t)) cond.goal = '高蛋白';
  else if (/低脂|减脂|少油/.test(t)) cond.goal = '低脂';
  else if (/低卡|低热量|轻食|清淡/.test(t)) cond.goal = '低卡';
  // 口味
  if (/牛肉|牛堡|安格斯/.test(t)) cond.taste = '牛肉';
  else if (/鸡肉|鸡腿|鸡排/.test(t)) cond.taste = '鸡肉';
  else if (/鱼|鳕鱼|麦香鱼/.test(t)) cond.taste = '鱼';
  else if (/辣/.test(t) && !/不辣|微辣/.test(t)) cond.taste = '辣';
  // 套餐类型
  if (/套餐|三件套|双人|多人|拼盘/.test(t)) cond.mealType = '套餐';
  else if (/单品|单点/.test(t)) cond.mealType = '单品';
  // 儿童
  if (/孩子|儿童|开心乐园|宝宝|娃/.test(t)) cond.isKids = true;
  return cond;
}

function condSummary(c) {
  const parts = [];
  if (c.priceMin != null && c.priceMax != null) parts.push(`价格 ${c.priceMin}-${c.priceMax} 元`);
  else if (c.priceMax != null) parts.push(`价格 ≤ ${c.priceMax} 元`);
  if (c.kcalMax != null) parts.push(`热量 ≤ ${c.kcalMax} 大卡`);
  if (c.taste) parts.push(`口味：${c.taste}`);
  if (c.goal) parts.push({高蛋白:'高蛋白',低脂:'低脂',低卡:'低卡'}[c.goal]);
  if (c.mealType) parts.push(c.mealType);
  if (c.isKids) parts.push('开心乐园餐');
  return parts.length ? parts.join(' · ') : '综合推荐';
}

function tasteHit(name, tags, taste) {
  const tagstr = (tags || []).join(' ');
  if (taste === '牛肉') return /牛肉|牛|巨无霸|吉士|安格斯|不素之霸/.test(name) || /牛肉|安格斯|纯牛肉/.test(tagstr);
  if (taste === '鸡肉') return /鸡/.test(name) || /鸡/.test(tagstr);
  if (taste === '鱼') return /鱼|鳕鱼/.test(name) || /鱼/.test(tagstr);
  if (taste === '辣') return /辣/.test(name) || /辣/.test(tagstr);
  return true;
}

function reason(r, cond) {
  const why = [];
  if (cond.priceMax != null && r.price <= cond.priceMax) why.push(`价格 ¥${r.price} 在预算内`);
  if (cond.kcalMax != null && r.kcal != null && r.kcal <= cond.kcalMax) why.push(`热量 ${r.kcal} kcal 达标`);
  if (cond.goal==="高蛋白" && r.protein != null) why.push(`蛋白质 ${r.protein}g 较高`);
  if (cond.goal==="低脂" && r.fat != null) why.push(`脂肪仅 ${r.fat}g 偏低`);
  if (cond.goal==="低卡" && r.kcal != null) why.push(`热量 ${r.kcal} kcal 较低`);
  if (cond.taste) why.push(`符合「${cond.taste}」口味`);
  if (cond.mealType==="套餐") why.push('套餐组合性价比高');
  if (cond.isKids) why.push('儿童友好搭配');
  if (!why.length) why.push('综合性价比与口味的人气之选');
  return why.slice(0,3).join('；');
}

function recommend(cond) {
  const results = [];
  for (const name in MENU) {
    const m = MENU[name];
    const price = m.price;
    // 价格过滤
    if (cond.priceMax != null && price > cond.priceMax) continue;
    if (cond.priceMin != null && price < cond.priceMin) continue;
    // 口味
    if (cond.taste && !tasteHit(name, m.tags, cond.taste)) continue;
    // 套餐类型
    if (cond.mealType === '套餐' && !/套餐|三件套|套/.test(name)) continue;
    if (cond.mealType === '单品' && /套餐|三件套|套/.test(name)) continue;
    // 儿童
    if (cond.isKids && !/开心乐园|儿童/.test(name) && !/开心乐园|儿童/.test(m.cat)) continue;

    const { nutr, composition } = resolveNutrition(name);
    const kcal = nutr ? nutr.kcal : null;
    const protein = nutr ? nutr.protein : null;
    const fat = nutr ? nutr.fat : null;
    const carb = nutr ? nutr.carb : null;
    const estimated = nutr ? !!nutr.estimated : false;
    // 热量过滤
    if (cond.kcalMax != null && kcal != null && kcal > cond.kcalMax) continue;

    // 打分
    let score = 0;
    if (/堡|套餐|三件套|卷|鸡|鱼|饭/.test(name)) score += 100;
    if (cond.goal === '高蛋白' && protein != null) score += protein * 3;
    if (cond.goal === '低脂' && fat != null) score += (50 - fat) * 2;
    if (cond.goal === '低卡' && kcal != null) score += (1000 - kcal) / 10;
    // 儿童餐优先
    if (cond.isKids && /开心乐园|儿童/.test(name)) score += 200;

    results.push({ name, price, kcal, protein, fat, carb, estimated, tags: m.tags || [], cat: m.cat, image: m.image || '', composition, score });
  }
  results.sort((a, b) => b.score - a.score);
  return results;
}

/* ==================== UI 渲染 ==================== */
const chatInner = document.getElementById('chatInner');
const chatWrap = document.getElementById('chatWrap');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');

function scrollBottom(){ requestAnimationFrame(() => { chatWrap.scrollTop = chatWrap.scrollHeight; }); }
function addUserMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="msg-avatar">🧑</div><div class="bubble">${esc(text)}</div>`;
  chatInner.appendChild(div); scrollBottom();
}
function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = 'typing';
  div.innerHTML = `<div class="msg-avatar">🍔</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatInner.appendChild(div); scrollBottom();
}
function removeTyping(){ const t = document.getElementById('typing'); if (t) t.remove(); }

function addAiReply(items, cond) {
  const div = document.createElement('div');
  div.className = 'msg ai';
  let html = `<div class="msg-avatar">🍔</div><div class="bubble">`;
  html += `<div class="think">🔍 已解析条件：${esc(condSummary(cond))} ｜ 📍 麦当劳北京东华门大街餐厅</div>`;
  if (!items.length) {
    html += `<p>😅 抱歉，当前菜单里没有完全符合「${esc(condSummary(cond))}」的餐品。要不要放宽一点预算或热量限制？</p>`;
  } else {
    const top = items.slice(0, 4);
    html += `<p>根据你的需求，为你找到 <b>${items.length}</b> 款，先看这 ${top.length} 款最合适的 👇</p>`;
    for (const r of top) {
      const kcal = r.kcal != null ? r.kcal : '—';
      const p = r.protein != null ? `${r.protein}g` : '—';
      const c = r.carb != null ? `${r.carb}g` : '—';
      const f = r.fat != null ? `${r.fat}g` : '—';
      const img = r.image ? `<img class="rec-img" src="${esc(r.image)}" alt="">` : '';
      html += `<div class="rec-card">
        <div class="rec-head">${img}<div class="rec-name">${esc(r.name)}</div><div class="rec-price">¥${r.price}</div></div>
        <div class="rec-tags">${(r.tags||[]).map(t=>`<span class="rec-tag">${esc(t)}</span>`).join('')}${r.cat?`<span class="rec-tag cat">${esc(r.cat)}</span>`:''}</div>
        <div class="rec-nutr">
          <div class="nutr-item kcal"><div class="nutr-val">${kcal}</div><div class="nutr-label">热量(kcal)</div></div>
          <div class="nutr-item protein"><div class="nutr-val">${p}</div><div class="nutr-label">蛋白质</div></div>
          <div class="nutr-item carb"><div class="nutr-val">${c}</div><div class="nutr-label">碳水</div></div>
          <div class="nutr-item fat"><div class="nutr-val">${f}</div><div class="nutr-label">脂肪</div></div>
        </div>${r.estimated ? `<div class="rec-est">⚠️ 该餐品营养数据暂未收录，以上为同类餐品估算值</div>` : ''}`;
      if (r.composition && r.composition.length) {
        html += `<div class="rec-comp">🍱 套餐组成：${r.composition.map(x=>esc(x.name)).join(' + ')}</div>`;
      }
      html += `<div class="rec-reason">💡 <b>推荐理由：</b>${reason(r, cond)}</div></div>`;
    }
    html += `<div class="tip">🍟 麦麦小贴士：本页为离线演示版，数据是 2026-10-10 的真实菜单快照；套餐营养为「默认组成」求和。想看更多或调整条件，直接跟我说~</div>`;
  }
  html += `</div>`;
  div.innerHTML = html;
  chatInner.appendChild(div); scrollBottom();
}

function send(text) {
  text = (text || '').trim();
  if (!text) return;
  addUserMsg(text);
  inputBox.value = ''; inputBox.style.height = 'auto';
  addTyping();
  sendBtn.disabled = true;
  setTimeout(() => {
    const cond = parseIntent(text);
    const items = recommend(cond);
    removeTyping();
    addAiReply(items, cond);
    sendBtn.disabled = false;
  }, 350);
}

sendBtn.addEventListener('click', () => send(inputBox.value));
inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(inputBox.value); }
});
inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 120) + 'px';
});
document.querySelectorAll('.quick-tag').forEach(tag => {
  tag.addEventListener('click', () => send(tag.dataset.q));
});
</script>
</body>
</html>
